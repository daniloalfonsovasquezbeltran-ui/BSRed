<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tótem y Sistema de Gestión - Terminal Panguipulli</title>

    <script src="/telemetria.js" defer></script>
    <script src="/mapa-rutas.js" defer></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen w-screen overflow-hidden flex flex-col md:flex-row relative">

    <!-- BOTÓN FLOTANTE MÓVIL -->
    <button onclick="toggleVistaMovil()" class="md:hidden absolute top-4 left-4 z-[1100] bg-blue-600 hover:bg-blue-500 text-white px-3 py-2 rounded-xl text-xs font-bold shadow-2xl flex items-center gap-1.5 transition">
        <span id="btn-movil-icono">🗺️</span> <span id="btn-movil-txt">Ver Mapa</span>
    </button>

    <!-- PANEL IZQUIERDO -->
    <aside id="panel-lateral" class="w-full md:w-[440px] h-full bg-slate-900 border-r border-slate-800 flex flex-col z-10 shadow-2xl absolute md:relative transition-all duration-300">
        
        <!-- Header con Botón de Usuario -->
        <header class="p-4 border-b border-slate-800 bg-slate-900 flex items-center justify-between pl-20 md:pl-4">
            <div>
                <h1 class="text-lg font-bold text-white flex items-center gap-2">
                    🚌 BSRed Panguipulli
                </h1>
                <p class="text-xs text-slate-400" id="info-usuario-head">Modo Pasajero (Invitado)</p>
            </div>
            <button onclick="abrirModalAuth()" id="btn-cuenta-header" class="px-3 py-1.5 bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold rounded-lg transition">
                🔑 Ingresar
            </button>
        </header>

        <!-- VISTA DE RUTAS -->
        <div id="vista-rutas-publica" class="flex-1 flex flex-col overflow-hidden">
            <div class="p-4 border-b border-slate-800 space-y-3">
                <div class="flex bg-slate-800 p-1 rounded-lg text-xs font-semibold">
                    <button id="tab-salidas" onclick="cambiarTab('salidas')" 
                            class="flex-1 py-1.5 rounded-md bg-blue-600 text-white transition shadow font-bold">
                        📤 Salidas
                    </button>
                    <button id="tab-llegadas" onclick="cambiarTab('llegadas')" 
                            class="flex-1 py-1.5 rounded-md text-slate-400 hover:text-white transition">
                        📥 Llegadas
                    </button>
                </div>

                <input id="busqueda" type="search" placeholder="Buscar destino, empresa o andén..."
                       oninput="onBusquedaChange()"
                       class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                
                <button id="btn-reset" onclick="seleccionarHorario(null)" 
                        class="w-full py-1.5 px-3 bg-slate-800 hover:bg-slate-700 text-blue-400 text-xs font-semibold rounded-lg border border-slate-700 transition flex items-center justify-center gap-1">
                    🌐 Ver todas las rutas (<span id="txt-tab-actual">Salidas</span>)
                </button>
            </div>

            <div id="lista-horarios" class="flex-1 overflow-y-auto p-4 space-y-3 custom-scrollbar"></div>
        </div>
    </aside>

    <!-- PANEL DERECHO: RECORRIDOS Y UBICACIÓN ESTIMADA -->
    <main class="flex-1 h-full relative bg-slate-950">
        <div id="map" class="w-full h-full"></div>

        <div class="absolute top-4 right-4 z-[1000] max-w-[85%] bg-slate-900/90 border border-slate-800 p-3 rounded-xl backdrop-blur text-xs space-y-1 shadow-lg">
            <div class="flex items-center gap-2">
                <span id="indicador-pulso" class="w-3 h-3 rounded-full bg-blue-500 animate-pulse"></span>
                <span id="estado-mapa" class="font-medium text-slate-200">Cargando mapa...</span>
            </div>
            <p class="text-[11px] text-slate-300 font-semibold">Ubicación estimada por horario</p>
            <p class="text-[10px] text-slate-400">Trazado por carretera aproximado</p>
            <p class="text-[10px] text-slate-400">El bus aparece entre su salida y llegada programadas. La posición puede diferir de la real.</p>
            <div id="info-detalle-ruta" class="text-[11px] text-slate-400 hidden"></div>
            <button id="btn-reintentar-mapa" type="button" onclick="recargarTrazados()" class="hidden text-blue-400 underline text-[11px]">Reintentar trazados</button>
        </div>
    </main>

    <!-- MODAL DE AUTENTICACIÓN -->
    <div id="modal-auth" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-[2000] flex items-center justify-center p-4 hidden">
        <div class="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl relative">
            <button onclick="cerrarModalAuth()" class="absolute top-4 right-4 text-slate-400 hover:text-white">✕</button>

            <!-- INICIO DE SESIÓN -->
            <form id="form-login" class="space-y-4" onsubmit="procesarLogin(event)">
                <h2 class="text-xl font-bold text-white text-center">Iniciar Sesión</h2>
                <div>
                    <label class="block text-xs text-slate-300 mb-1">Correo Electrónico</label>
                    <input type="email" id="login-email" required placeholder="correo@ejemplo.com"
                           class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-xs text-slate-300 mb-1">Contraseña</label>
                    <input type="password" id="login-password" required placeholder="••••••••"
                           class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                </div>
                <p id="login-error" class="text-xs text-rose-400 hidden" role="alert"></p>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2 rounded-lg text-sm transition">
                    Ingresar
                </button>
                <p class="text-center text-xs text-slate-400">
                    ¿Sin cuenta? <button type="button" onclick="alternarAuth('registro')" class="text-blue-400 hover:underline">Regístrate</button>
                </p>
            </form>

            <!-- REGISTRO -->
            <form id="form-registro" class="space-y-4 hidden" onsubmit="procesarRegistro(event)">
                <h2 class="text-xl font-bold text-white text-center">Crear Cuenta</h2>
                <div>
                    <label class="block text-xs text-slate-300 mb-1">Nombre Completo / Empresa</label>
                    <input type="text" id="reg-nombre" required placeholder="Ej: Juan Pérez"
                           class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-xs text-slate-300 mb-1">Correo Electrónico</label>
                    <input type="email" id="reg-email" required placeholder="correo@ejemplo.com"
                           class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-xs text-slate-300 mb-1">Tipo de Cuenta</label>
                    <select id="reg-rol" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                        <option value="pasajero">Pasajero / Usuario Normal</option>
                        <option value="empresa">Empresa de Transportes</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs text-slate-300 mb-1">Contraseña</label>
                    <input type="password" id="reg-password" required placeholder="••••••••"
                           class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                </div>
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2 rounded-lg text-sm transition">
                    Guardar Registro
                </button>
                <p class="text-center text-xs text-slate-400">
                    ¿Ya tienes cuenta? <button type="button" onclick="alternarAuth('login')" class="text-blue-400 hover:underline">Inicia Sesión</button>
                </p>
            </form>
        </div>
    </div>

    <script>
        const CENTRO_TERMINAL = [-39.6430, -72.3312];

        const PALETA_SALIDAS = ["#3b82f6", "#06b6d4", "#10b981", "#6366f1", "#8b5cf6"];
        const PALETA_LLEGADAS = ["#f59e0b", "#ec4899", "#f97316", "#ef4444", "#eab308"];

        const map = typeof L !== 'undefined'
            ? L.map('map').setView(CENTRO_TERMINAL, 10)
            : null;
        if (map) {
            L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
                maxZoom: 16,
                attribution: 'Tiles © Esri'
            }).addTo(map);
        }

        let currentTab = 'salidas';
        let datosHorarios = [];
        let mapaRutas = null;
        let solicitudHorarios = null;
        let versionHorarios = 0;
        let esperaBusqueda = null;
        const estadosRutas = new Map();
        let itemSeleccionadoIndex = null;
        let mostrantoMapaMovil = false;

        let usuarioSesion = null;

        function actualizarInterfazSesion() {
            const btn = document.getElementById('btn-cuenta-header');
            const info = document.getElementById('info-usuario-head');

            if (!usuarioSesion) {
                info.innerText = "Modo Pasajero (Invitado)";
                btn.innerText = "🔑 Ingresar";
                btn.onclick = abrirModalAuth;
            } else {
                info.innerText = `👤 Hola, ${usuarioSesion.nombre}`;
                btn.innerText = "👤 Mi Perfil";
                btn.onclick = () => { window.location.href = '/usuario'; };
            }
        }
        
        async function solicitarAPI(url, opciones = {}) {
            const controlador = new AbortController();
            let tiempoLimite;
            const vencimiento = new Promise((_, rechazar) => {
                tiempoLimite = setTimeout(() => {
                    controlador.abort();
                    rechazar(new Error('Tiempo de espera agotado'));
                }, 8000);
            });
            try {
                const solicitud = (async () => {
                    const res = await fetch(url, {
                        ...opciones, credentials: 'same-origin', cache: 'no-store', signal: controlador.signal
                    });
                    const data = res.status === 204 ? null : await res.json();
                    return { status: res.status, ok: res.ok, data };
                })();
                // El límite incluye el cuerpo JSON, no solamente las cabeceras.
                return await Promise.race([solicitud, vencimiento]);
            } finally {
                clearTimeout(tiempoLimite);
            }
        }

        async function recuperarSesion() {
            try {
                const res = await solicitarAPI('/api/sesion');
                if (res.ok) {
                    const data = res.data;
                    if (data.success && data.user) usuarioSesion = data.user;
                }
            } catch (_) {
                // El acceso al perfil se verifica nuevamente en el servidor.
            }
            actualizarInterfazSesion();
        }
        recuperarSesion();

        function abrirModalAuth() { document.getElementById('modal-auth').classList.remove('hidden'); }
        function cerrarModalAuth() { document.getElementById('modal-auth').classList.add('hidden'); }
        
        function alternarAuth(vista) {
            document.getElementById('form-login').classList.toggle('hidden', vista !== 'login');
            document.getElementById('form-registro').classList.toggle('hidden', vista !== 'registro');
        }

        async function procesarLogin(e) {
            e.preventDefault();
            const boton = e.currentTarget.querySelector('button[type="submit"]');
            const error = document.getElementById('login-error');
            error.classList.add('hidden');
            boton.disabled = true;
            boton.textContent = 'Verificando...';
            try {
                const res = await solicitarAPI('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'same-origin',
                    cache: 'no-store',
                    body: JSON.stringify({
                        email: document.getElementById('login-email').value.trim(),
                        password: document.getElementById('login-password').value
                    })
                });
                const data = res.data;
                if (!res.ok || !data.success || !data.user) {
                    error.textContent = data.message || data.error || 'No se pudo iniciar sesión. Revisa tu correo y contraseña.';
                    error.classList.remove('hidden');
                    return;
                }
                document.getElementById('login-password').value = '';
                window.location.href = '/usuario';
            } catch (_) {
                error.textContent = 'No se pudo conectar. Inténtalo nuevamente.';
                error.classList.remove('hidden');
            } finally {
                boton.disabled = false;
                boton.textContent = 'Ingresar';
            }
        }

        async function procesarRegistro(e) {
            e.preventDefault();
            const payload = {
                nombre: document.getElementById('reg-nombre').value,
                email: document.getElementById('reg-email').value,
                password: document.getElementById('reg-password').value,
                rol: document.getElementById('reg-rol').value
            };

            try {
                const res = await solicitarAPI('/api/registro', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'same-origin',
                    cache: 'no-store',
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    alert('¡Cuenta creada! Inicia sesión con tu correo y contraseña.');
                    document.getElementById('login-email').value = payload.email;
                    document.getElementById('reg-password').value = '';
                    alternarAuth('login');
                } else {
                    alert('Error al crear usuario (quizás el correo ya existe).');
                }
            } catch (err) {
                alert('Ocurrió un error de conexión.');
            }
        }

        function toggleVistaMovil() {
            mostrantoMapaMovil = !mostrantoMapaMovil;
            const panel = document.getElementById('panel-lateral');
            const icono = document.getElementById('btn-movil-icono');
            const txt = document.getElementById('btn-movil-txt');

            if (mostrantoMapaMovil) {
                panel.style.transform = 'translateX(-100%)';
                icono.innerText = '📋';
                txt.innerText = 'Ver Panel';
                setTimeout(() => { if (map) map.invalidateSize(); }, 300);
            } else {
                panel.style.transform = 'translateX(0)';
                icono.innerText = '🗺️';
                txt.innerText = 'Ver Mapa';
            }
        }

        function mostrarEstadoMapa(estado) {
            document.getElementById('estado-mapa').textContent = estado.texto;
            const indicador = document.getElementById('indicador-pulso');
            indicador.className = `w-3 h-3 shrink-0 rounded-full ${estado.tipo === 'cargando'
                ? 'bg-blue-500 animate-pulse' : (estado.tipo === 'error' || estado.tipo === 'parcial' ? 'bg-amber-500' : 'bg-blue-500')}`;
            document.getElementById('btn-reintentar-mapa').classList.toggle('hidden', !['error', 'parcial'].includes(estado.tipo));
        }

        function onBusquedaChange() {
            clearTimeout(esperaBusqueda);
            versionHorarios++;
            if (solicitudHorarios) solicitudHorarios.abort();
            if (mapaRutas) mapaRutas.limpiar();
            datosHorarios = [];
            itemSeleccionadoIndex = null;
            estadosRutas.clear();
            renderizarLista(true);
            mostrarEstadoMapa({ tipo: 'cargando', texto: 'Buscando horarios...' });
            esperaBusqueda = setTimeout(cargarDatosAPI, 250);
        }

        async function cargarDatosAPI() {
            const version = ++versionHorarios;
            if (solicitudHorarios) solicitudHorarios.abort();
            const controlador = new AbortController();
            solicitudHorarios = controlador;
            if (mapaRutas) mapaRutas.limpiar();
            datosHorarios = [];
            itemSeleccionadoIndex = null;
            estadosRutas.clear();
            renderizarLista(true);
            mostrarEstadoMapa({ tipo: 'cargando', texto: 'Obteniendo horarios...' });
            const query = document.getElementById('busqueda').value.trim();
            let tiempoLimite;
            const vencimiento = new Promise((_, fallo) => {
                tiempoLimite = setTimeout(() => { controlador.abort(); fallo(new Error('timeout')); }, 10000);
                controlador.signal.addEventListener('abort', () => fallo(new Error('cancelada')), { once: true });
            });
            try {
                const solicitud = (async () => {
                    const res = await fetch(`/api/horarios?tab=${currentTab}&q=${encodeURIComponent(query)}`, {
                        signal: controlador.signal, credentials: 'same-origin', cache: 'no-store'
                    });
                    const datos = await res.json();
                    if (!res.ok || !Array.isArray(datos)) throw new Error('horarios');
                    return datos;
                })();
                const datos = await Promise.race([solicitud, vencimiento]);
                if (version !== versionHorarios) return;
                datosHorarios = datos;
                renderizarLista();
                if (mapaRutas) mapaRutas.mostrar(datosHorarios, { tab: currentTab });
                else mostrarEstadoMapa({ tipo: 'error', texto: 'Mapa no disponible; consulta los horarios en el panel' });
            } catch (_) {
                if (version !== versionHorarios) return;
                renderizarLista(false, 'No se pudieron cargar los horarios. Inténtalo nuevamente.');
                mostrarEstadoMapa({ tipo: 'error', texto: 'No se pudieron cargar los horarios' });
            } finally {
                clearTimeout(tiempoLimite);
                if (solicitudHorarios === controlador) solicitudHorarios = null;
            }
        }

        function cambiarTab(tab) {
            if (currentTab === tab) return;
            clearTimeout(esperaBusqueda);
            currentTab = tab;
            itemSeleccionadoIndex = null;
            document.getElementById('tab-salidas').className = tab === 'salidas' ? 'flex-1 py-1.5 rounded-md bg-blue-600 text-white font-bold' : 'flex-1 py-1.5 text-slate-400';
            document.getElementById('tab-llegadas').className = tab === 'llegadas' ? 'flex-1 py-1.5 rounded-md bg-amber-600 text-white font-bold' : 'flex-1 py-1.5 text-slate-400';
            document.getElementById('txt-tab-actual').textContent = tab === 'salidas' ? 'Salidas' : 'Llegadas';
            cargarDatosAPI();
        }

        function crearTexto(etiqueta, clases, texto) {
            const elemento = document.createElement(etiqueta);
            elemento.className = clases;
            elemento.textContent = texto;
            return elemento;
        }

        function renderizarLista(cargando = false, error = '') {
            const contenedor = document.getElementById('lista-horarios');
            contenedor.replaceChildren();
            if (!datosHorarios.length) {
                contenedor.append(crearTexto('p', 'text-center text-slate-400 py-10 text-sm',
                    error || (cargando ? 'Cargando horarios...' : 'No se encontraron recorridos.')));
                return;
            }
            const paleta = currentTab === 'salidas' ? PALETA_SALIDAS : PALETA_LLEGADAS;
            datosHorarios.forEach((item, index) => {
                const tarjeta = document.createElement('button');
                tarjeta.type = 'button';
                tarjeta.className = `w-full text-left p-4 rounded-xl border transition cursor-pointer flex justify-between items-center ${
                    itemSeleccionadoIndex === index ? 'bg-slate-800 border-blue-500 ring-2 ring-blue-500/30' : 'bg-slate-800/60 border-slate-700/60 hover:border-slate-500'}`;
                tarjeta.onclick = () => seleccionarHorario(index);
                const detalle = crearTexto('div', 'space-y-1', '');
                const cabecera = crearTexto('div', 'flex items-center gap-2', '');
                const punto = crearTexto('span', 'w-3 h-3 shrink-0 rounded-full', '');
                punto.style.backgroundColor = paleta[index % paleta.length];
                cabecera.append(punto, crearTexto('h3', 'font-bold text-white text-sm', item.empresa || 'Servicio de buses'),
                    crearTexto('span', 'text-[10px] px-2 py-0.5 rounded-full bg-slate-700 text-slate-300', `Andén ${item.anden || 'sin asignar'}`));
                const datoEstado = estadosRutas.get(item.id);
                const estado = crearTexto('p', `text-[10px] ${datoEstado ? (datoEstado.disponible ? 'text-blue-400' : 'text-amber-400') : 'text-slate-400'}`,
                    datoEstado ? datoEstado.texto : (mapaRutas ? 'Buscando trazado...' : 'Mapa no disponible'));
                estado.id = `estado-ruta-${item.id}`;
                estado.title = datoEstado ? datoEstado.nota_itinerario || datoEstado.texto : '';
                detalle.append(cabecera, crearTexto('p', 'text-xs text-slate-300', `${item.origen || ''} → ${item.destino || ''}`), estado);
                const hora = crearTexto('div', 'text-right pl-2 shrink-0', '');
                hora.append(crearTexto('span', 'text-xs text-slate-400 block', currentTab === 'salidas' ? 'Salida' : 'Llegada'),
                    crearTexto('span', 'text-xl font-black text-white font-mono', (currentTab === 'salidas' ? item.salida : item.llegada) || '—'));
                tarjeta.append(detalle, hora);
                contenedor.append(tarjeta);
            });
        }

        function seleccionarHorario(index) {
            itemSeleccionadoIndex = index == null || itemSeleccionadoIndex === index ? null : index;
            renderizarLista();
            if (mapaRutas) mapaRutas.seleccionar(itemSeleccionadoIndex == null ? null : datosHorarios[itemSeleccionadoIndex].id);
        }

        function recargarTrazados() {
            if (mapaRutas && datosHorarios.length) mapaRutas.refrescar();
            else cargarDatosAPI();
        }

        function iniciarMapaRutas() {
            if (map && window.BSRedMapaRutas) {
                mapaRutas = window.BSRedMapaRutas.crear({
                    map, L, onEstado: mostrarEstadoMapa,
                    onDetalle: texto => {
                        const detalle = document.getElementById('info-detalle-ruta');
                        detalle.textContent = texto;
                        detalle.classList.toggle('hidden', !texto);
                    },
                    onRuta: (id, estado) => {
                        estadosRutas.set(id, estado);
                        const etiqueta = document.getElementById(`estado-ruta-${id}`);
                        if (etiqueta) {
                            etiqueta.textContent = estado.texto;
                            etiqueta.title = estado.nota_itinerario || estado.texto;
                            etiqueta.className = `text-[10px] ${estado.disponible ? 'text-blue-400' : 'text-amber-400'}`;
                        }
                    },
                    onSeleccion: id => {
                        const indice = datosHorarios.findIndex(item => item.id === id);
                        if (indice >= 0) seleccionarHorario(indice);
                    }
                });
            }
            cargarDatosAPI();
        }

        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', iniciarMapaRutas, { once: true });
        else iniciarMapaRutas();
    </script>
</body>
</html>
