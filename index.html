<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tótem Informativo - Terminal Panguipulli</title>

    <!-- Manifest PWA -->
    <link rel="manifest" href="manifest.json">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Leaflet CSS & JS para Mapa Interactivo -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen w-screen overflow-hidden flex flex-col md:flex-row">

    <!-- PANEL IZQUIERDO: CONTROLES, TABLA Y FILTROS -->
    <aside class="w-full md:w-[420px] h-2/5 md:h-full bg-slate-900 border-r border-slate-800 flex flex-col z-10 shadow-2xl">
        
        <!-- Header -->
        <header class="p-4 border-b border-slate-800 bg-slate-900 flex items-center justify-between">
            <div>
                <h1 class="text-lg font-bold text-white flex items-center gap-2">
                    🚌 Terminal Panguipulli
                </h1>
                <p class="text-xs text-slate-400">Horarios y monitoreo de rutas en vivo</p>
            </div>
            <img src="logo.jpg" alt="Logo" class="h-10 w-10 object-contain rounded-lg border border-slate-700" onerror="this.style.display='none'">
        </header>

        <!-- Filtros y Búsqueda -->
        <div class="p-4 border-b border-slate-800 space-y-3">
            <!-- Pestañas Salidas / Llegadas -->
            <div class="flex bg-slate-800 p-1 rounded-lg text-xs font-semibold">
                <button id="tab-salidas" onclick="cambiarTab('salidas')" 
                        class="flex-1 py-1.5 rounded-md bg-blue-600 text-white transition shadow font-bold">
                    📤 Salidas
                </button>
                <button id="tab-llegadas" onclick="cambiarTab('llegadas')" 
                        class="flex-1 py-1.5 rounded-md text-slate-400 hover:text-white transition">
                    📥 Llegadas
                </button>
            </div>

            <!-- Caja de búsqueda -->
            <input id="busqueda" type="search" placeholder="Buscar destino, empresa o andén..."
                   oninput="onBusquedaChange()"
                   class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
            
            <!-- Botón Restaurar Mapa -->
            <button id="btn-reset" onclick="seleccionarHorario(null)" 
                    class="w-full py-1.5 px-3 bg-slate-800 hover:bg-slate-700 text-blue-400 text-xs font-semibold rounded-lg border border-slate-700 transition flex items-center justify-center gap-1">
                🌐 Ver todas las rutas (<span id="txt-tab-actual">Salidas</span>)
            </button>
        </div>

        <!-- Contenedor de Horarios -->
        <div id="lista-horarios" class="flex-1 overflow-y-auto p-4 space-y-3 custom-scrollbar">
            <!-- Carga dinámicamente desde API -->
        </div>

    </aside>

    <!-- PANEL DERECHO: MAPA DE CARRETERAS EN TIEMPO REAL -->
    <main class="flex-1 h-3/5 md:h-full relative bg-slate-950">
        <div id="map" class="w-full h-full"></div>

        <!-- Leyenda de Estado -->
        <div class="absolute top-4 right-4 z-[1000] bg-slate-900/90 border border-slate-800 p-3 rounded-xl backdrop-blur text-xs space-y-1 shadow-lg">
            <div class="flex items-center gap-2">
                <span id="indicador-pulso" class="w-3 h-3 rounded-full bg-blue-500 animate-pulse"></span>
                <span id="estado-mapa" class="font-medium text-slate-200">Cargando mapa...</span>
            </div>
            <div id="info-detalle-ruta" class="text-[11px] text-slate-400 font-mono hidden"></div>
        </div>
    </main>

    <script>
        // COORDENADAS GPS DE TODAS LAS LOCALIDADES
        const COORDENADAS = {
            "panguipulli": [-39.6430, -72.3312],
            "coñaripe":    [-39.5532, -71.9790],
            "los lagos":   [-39.8511, -72.8228],
            "villarrica":  [-39.2822, -72.2272],
            "huerquehue":  [-39.6631, -72.2415],
            "liquiñe":     [-39.7360, -71.8540],
            "choshuenco":  [-39.8402, -72.0833],
            "neltume":     [-39.8456, -71.9567],
            "puerto fuy":  [-39.8660, -71.8885],
            "lanco":       [-39.4475, -72.7856],
            "lican ray":   [-39.4828, -72.1528],
            "temuco":      [-38.7359, -72.5904],
            "valdivia":    [-39.8142, -73.2459]
        };

        const PALETA_SALIDAS = ["#3b82f6", "#06b6d4", "#10b981", "#6366f1", "#8b5cf6"];
        const PALETA_LLEGADAS = ["#f59e0b", "#ec4899", "#f97316", "#ef4444", "#eab308"];

        const map = L.map('map').setView(COORDENADAS["panguipulli"], 10);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap &copy; CARTO'
        }).addTo(map);

        let currentTab = 'salidas';
        let datosHorarios = [];
        let capasRutas = {};
        let itemSeleccionadoIndex = null;
        let cacheRutasOSRM = {};

        function crearIconoBus(color) {
            return L.divIcon({
                html: `<div style="background-color: ${color};" class="text-white rounded-full p-1 shadow-xl border-2 border-slate-900 flex items-center justify-center w-8 h-8 text-xs font-bold transition-transform hover:scale-125">🚌</div>`,
                className: '',
                iconSize: [32, 32],
                iconAnchor: [16, 16]
            });
        }

        async function obtenerRutaOSRM(origenGPS, destinoGPS) {
            const key = `${origenGPS.join(',')}-${destinoGPS.join(',')}`;
            if (cacheRutasOSRM[key]) return cacheRutasOSRM[key];

            const url = `https://router.project-osrm.org/route/v1/driving/${origenGPS[1]},${origenGPS[0]};${destinoGPS[1]},${destinoGPS[0]}?overview=full&geometries=geojson`;
            try {
                const res = await fetch(url);
                const data = await res.json();
                if (data.routes && data.routes.length > 0) {
                    const coords = data.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
                    cacheRutasOSRM[key] = coords;
                    return coords;
                }
            } catch (e) {
                console.warn("Error OSRM, usando trayectoria directa:", e);
            }
            return [origenGPS, destinoGPS];
        }

        async function cargarDatosAPI() {
            document.getElementById("estado-mapa").innerText = "Obteniendo horarios...";
            try {
                const res = await fetch(`/api/horarios?tab=${currentTab}`);
                datosHorarios = await res.json();
                renderizarLista();
                await actualizarMapa();
            } catch (err) {
                console.error("Error API:", err);
                document.getElementById("estado-mapa").innerText = "Error de conexión";
            }
        }

        function cambiarTab(tab) {
            if (currentTab === tab) return;
            currentTab = tab;
            itemSeleccionadoIndex = null;

            const btnSalidas = document.getElementById('tab-salidas');
            const btnLlegadas = document.getElementById('tab-llegadas');
            const txtTab = document.getElementById('txt-tab-actual');

            if (tab === 'salidas') {
                btnSalidas.className = 'flex-1 py-1.5 rounded-md bg-blue-600 text-white transition shadow font-bold';
                btnLlegadas.className = 'flex-1 py-1.5 rounded-md text-slate-400 hover:text-white transition';
                txtTab.innerText = "Salidas";
            } else {
                btnLlegadas.className = 'flex-1 py-1.5 rounded-md bg-amber-600 text-white transition shadow font-bold';
                btnSalidas.className = 'flex-1 py-1.5 rounded-md text-slate-400 hover:text-white transition';
                txtTab.innerText = "Llegadas";
            }

            cargarDatosAPI();
        }

        function obtenerItemsFiltrados() {
            const q = document.getElementById("busqueda").value.toLowerCase().trim();
            return datosHorarios.filter(item => {
                if (!q) return true;
                const textoSearch = `${item.empresa} ${item.origen} ${item.destino} ${item.anden} ${item.sector} ${item.dias}`.toLowerCase();
                return textoSearch.includes(q);
            });
        }

        function onBusquedaChange() {
            itemSeleccionadoIndex = null;
            renderizarLista();
            actualizarMapa();
        }

        function renderizarLista() {
            const contenedor = document.getElementById("lista-horarios");
            contenedor.innerHTML = "";

            const itemsVisibles = obtenerItemsFiltrados();

            if (itemsVisibles.length === 0) {
                contenedor.innerHTML = `
                    <div class="text-center py-8 text-slate-500 text-xs">
                        No se encontraron ${currentTab} disponibles.
                    </div>`;
                return;
            }

            const paleta = currentTab === 'salidas' ? PALETA_SALIDAS : PALETA_LLEGADAS;

            itemsVisibles.forEach((item) => {
                const origIndex = datosHorarios.indexOf(item);
                const estaSeleccionado = itemSeleccionadoIndex === origIndex;
                const color = paleta[origIndex % paleta.length];

                contenedor.innerHTML += `
                <div onclick="seleccionarHorario(${origIndex})"
                     class="p-4 rounded-xl border transition cursor-pointer flex justify-between items-center ${
                         estaSeleccionado 
                         ? (currentTab === 'salidas' ? 'bg-slate-800 border-blue-500 shadow-xl ring-2 ring-blue-500/30' : 'bg-slate-800 border-amber-500 shadow-xl ring-2 ring-amber-500/30') 
                         : 'bg-slate-800/60 border-slate-700/60 hover:border-slate-500 hover:bg-slate-800'
                     }">
                    <div class="space-y-1">
                        <div class="flex items-center gap-2">
                            <span class="w-3 h-3 rounded-full flex-shrink-0" style="background-color: ${color}"></span>
                            <h3 class="font-bold text-white text-sm">${item.empresa}</h3>
                            <span class="text-[10px] px-2 py-0.5 rounded-full bg-slate-700 text-slate-300 font-mono">Andén ${item.anden}</span>
                        </div>
                        <p class="text-xs text-slate-300">
                            ${item.origen} ➔ <span class="font-bold text-white">${item.destino}</span>
                        </p>
                        <div class="flex items-center gap-2 text-[11px] text-slate-400">
                            <span>🗓️ ${item.dias}</span>
                            <span>•</span>
                            <span class="text-slate-300">Sector ${item.sector}</span>
                        </div>
                    </div>
                    <div class="text-right pl-2">
                        <span class="text-xs text-slate-400 block">${currentTab === 'salidas' ? 'Salida' : 'Llegada'}</span>
                        <span class="text-xl font-black text-white font-mono">${item.salida}</span>
                    </div>
                </div>`;
            });
        }

        async function actualizarMapa() {
            Object.keys(capasRutas).forEach(k => {
                if (capasRutas[k].intervalo) clearInterval(capasRutas[k].intervalo);
                map.removeLayer(capasRutas[k].polyline);
                map.removeLayer(capasRutas[k].marker);
            });
            capasRutas = {};

            let itemsAMostrar = [];
            if (itemSeleccionadoIndex !== null && datosHorarios[itemSeleccionadoIndex]) {
                itemsAMostrar = [{ item: datosHorarios[itemSeleccionadoIndex], index: itemSeleccionadoIndex }];
            } else {
                const filtrados = obtenerItemsFiltrados();
                itemsAMostrar = filtrados.map(item => ({ item, index: datosHorarios.indexOf(item) }));
            }

            if (itemsAMostrar.length === 0) {
                document.getElementById("estado-mapa").innerText = "Sin rutas activas";
                document.getElementById("info-detalle-ruta").classList.add("hidden");
                return;
            }

            document.getElementById("estado-mapa").innerText = `Cargando ${itemsAMostrar.length} ruta(s)...`;

            const paleta = currentTab === 'salidas' ? PALETA_SALIDAS : PALETA_LLEGADAS;
            const esLlegada = currentTab === 'llegadas';
            let todasLasCoordenadas = [];

            for (const entry of itemsAMostrar) {
                const h = entry.item;
                const idx = entry.index;

                const origenKey = (h.origen || "").toLowerCase();
                const destinoKey = (h.destino || "").toLowerCase();

                const origenGPS = COORDENADAS[origenKey] || COORDENADAS["panguipulli"];
                const destinoGPS = COORDENADAS[destinoKey] || COORDENADAS["panguipulli"];

                if (origenGPS[0] === destinoGPS[0] && origenGPS[1] === destinoGPS[1]) continue;

                const coords = await obtenerRutaOSRM(origenGPS, destinoGPS);
                todasLasCoordenadas.push(...coords);

                const color = paleta[idx % paleta.length];

                const polyline = L.polyline(coords, { 
                    color: color, 
                    weight: itemSeleccionadoIndex === idx ? 6 : 4, 
                    opacity: itemSeleccionadoIndex === idx ? 1.0 : 0.8,
                    dashArray: esLlegada ? '8, 8' : null
                }).addTo(map);

                const marker = L.marker(coords[0], { icon: crearIconoBus(color) }).addTo(map);

                polyline.bindTooltip(`<b>${h.empresa}</b><br>${h.origen} ➔ ${h.destino}<br>Hora: ${h.salida} | Andén ${h.anden}`, { sticky: true });
                
                polyline.on('click', () => seleccionarHorario(idx));
                marker.on('click', () => seleccionarHorario(idx));

                capasRutas[idx] = { polyline, marker, coords, pasoActual: 0, intervalo: null };
                iniciarAnimacionBus(idx);
            }

            if (todasLasCoordenadas.length > 0) {
                const bounds = L.latLngBounds(todasLasCoordenadas);
                map.fitBounds(bounds, { padding: [50, 50], maxZoom: 12 });
            }

            const numRutas = Object.keys(capasRutas).length;
            const pulso = document.getElementById("indicador-pulso");
            const infoDetalle = document.getElementById("info-detalle-ruta");

            pulso.className = `w-3 h-3 rounded-full animate-pulse ${esLlegada ? 'bg-amber-500' : 'bg-blue-500'}`;

            if (itemSeleccionadoIndex !== null) {
                const sel = datosHorarios[itemSeleccionadoIndex];
                document.getElementById("estado-mapa").innerText = `Seleccionado: ${sel.empresa}`;
                infoDetalle.innerHTML = `${sel.origen} ➔ ${sel.destino} | ${sel.salida} hrs (Andén ${sel.anden})`;
                infoDetalle.classList.remove("hidden");
            } else {
                document.getElementById("estado-mapa").innerText = `${numRutas} recorrido(s) de ${currentTab.toUpperCase()} en mapa`;
                infoDetalle.classList.add("hidden");
            }
        }

        function iniciarAnimacionBus(index) {
            const capa = capasRutas[index];
            if (!capa || !capa.coords || capa.coords.length === 0) return;

            capa.intervalo = setInterval(() => {
                if (capa.pasoActual < capa.coords.length) {
                    capa.marker.setLatLng(capa.coords[capa.pasoActual]);
                    capa.pasoActual++;
                } else {
                    capa.pasoActual = 0;
                }
            }, 250);
        }

        function seleccionarHorario(index) {
            itemSeleccionadoIndex = itemSeleccionadoIndex === index ? null : index;
            renderizarLista();
            actualizarMapa();
        }

        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("sw.js").catch(console.error);
        }

        cargarDatosAPI();
    </script>
</body>
</html>
